<!DOCTYPE html>
<html>
<head>
  <title>Geolocation App</title>
  <style>
    body {
      font-family: Arial;
    }
    .error {
      color: red;
    }
    .location {
      margin-top: 10px;
    }
  </style>
</head>
<body onload="loadHistory()">

  <h2>Get My Location</h2>

  <button onclick="getLocation()">Get My Location</button>

  <div id="output" class="location"></div>

  <h3>Location History (Last 5)</h3>
  <ul id="history"></ul>

  <script>
    function getLocation() {
      if (!navigator.geolocation) {
        document.getElementById("output").innerHTML =
          "<p class='error'>Geolocation is not supported by this browser.</p>";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        showPosition,
        showError,
        { timeout: 10000 }
      );
    }

    function showPosition(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      document.getElementById("output").innerHTML =
        "Latitude: " + lat + "<br>Longitude: " + lon;

      const newEntry = {
        latitude: lat,
        longitude: lon,
        time: new Date().toLocaleString()
      };

      let history = JSON.parse(localStorage.getItem("locations")) || [];

      history.unshift(newEntry);

      if (history.length > 5) {
        history.pop();
      }

      localStorage.setItem("locations", JSON.stringify(history));

      loadHistory();
    }

    function showError(error) {
      let message = "";

      switch (error.code) {
        case error.PERMISSION_DENIED:
          message = "User denied the request for Geolocation.";
          break;
        case error.TIMEOUT:
          message = "The request to get user location timed out.";
          break;
        case error.POSITION_UNAVAILABLE:
          message = "Location information is unavailable.";
          break;
        default:
          message = "An unknown error occurred.";
      }

      document.getElementById("output").innerHTML =
        "<p class='error'>" + message + "</p>";
    }

    function loadHistory() {
      const historyList = document.getElementById("history");
      historyList.innerHTML = "";

      const history = JSON.parse(localStorage.getItem("locations")) || [];

      history.forEach(loc => {
        const li = document.createElement("li");
        li.innerText =
          "Lat: " + loc.latitude +
          ", Lon: " + loc.longitude +
          " (" + loc.time + ")";
        historyList.appendChild(li);
      });
    }
  </script>

</body>
</html>
