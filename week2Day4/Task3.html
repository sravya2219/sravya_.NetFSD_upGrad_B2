<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">

  <h2 class="text-center mb-4">Training Institute Dashboard</h2>

  <div class="row g-4">

    <!-- Left Section : Registration Form -->
    <div class="col-lg-5 col-md-6 col-12">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="mb-3 text-center">Register Student</h4>

          <form>
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input type="text" class="form-control" placeholder="Enter name" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Course</label>
              <select class="form-select" required>
                <option value="">Select Course</option>
                <option>Java</option>
                <option>Python</option>
                <option>Full Stack Development</option>
                <option>Data Science</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" placeholder="Enter email" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Contact Number</label>
              <input type="tel" class="form-control" placeholder="Enter contact number" required>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary">Register</button>
              <button type="reset" class="btn btn-secondary">Reset</button>
            </div>

          </form>
        </div>
      </div>
    </div>

    <!-- Right Section : Registered Users Table -->
    <div class="col-lg-7 col-md-6 col-12">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="mb-3 text-center">Registered Students</h4>

          <div class="table-responsive">
            <table class="table table-bordered table-striped table-hover align-middle">
              <thead class="table-dark">
                <tr>
                  <th>Name</th>
                  <th>Course</th>
                  <th>Email</th>
                  <th>Contact</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Sravya</td>
                  <td>Java</td>
                  <td>sravya@email.com</td>
                  <td>9876543210</td>
                </tr>
                <tr>
                  <td>Kavya</td>
                  <td>Python</td>
                  <td>kavya@email.com</td>
                  <td>9123456780</td>
                </tr>
                <tr>
                  <td>Navya</td>
                  <td>Full Stack</td>
                  <td>navya@email.com</td>
                  <td>9988776655</td>
                </tr>
              </tbody>
            </table>
          </div>

        </div>
      </div>
    </div>

  </div>

</div>

</body>
</html>
