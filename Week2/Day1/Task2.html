<!DOCTYPE html>
<html>
<head>
  <title>Registration Form</title>
  <style>
    .error {
      color: red;
      font-size: 14px;
    }
    .success {
      color: green;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h2>Registration Form</h2>

  <!-- Name -->
  <label>Name:</label><br>
  <input type="text" id="name" onchange="validateName()">
  <div id="nameMsg" class="error"></div><br>

  <!-- Email -->
  <label>Email:</label><br>
  <input type="text" id="email" onchange="validateEmail()">
  <div id="emailMsg" class="error"></div><br>

  <!-- Age -->
  <label>Age:</label><br>
  <input type="number" id="age" onchange="validateAge()">
  <div id="ageMsg" class="error"></div><br>

  <!-- Submit -->
  <button onclick="saveData()">Register</button>

  <div id="resultMsg"></div>

  <script>
    function validateName() {
      const name = document.getElementById("name").value;
      const msg = document.getElementById("nameMsg");

      if (name === "") {
        msg.innerText = "Name cannot be empty";
        return false;
      } else {
        msg.innerText = "";
        return true;
      }
    }

    function validateEmail() {
      const email = document.getElementById("email").value;
      const msg = document.getElementById("emailMsg");

      if (!email.includes("@")) {
        msg.innerText = "Email must contain @";
        return false;
      } else {
        msg.innerText = "";
        return true;
      }
    }

    function validateAge() {
      const age = document.getElementById("age").value;
      const msg = document.getElementById("ageMsg");

      if (age <= 18) {
        msg.innerText = "Age must be greater than 18";
        return false;
      } else {
        msg.innerText = "";
        return true;
      }
    }

    function saveData() {
      const isNameValid = validateName();
      const isEmailValid = validateEmail();
      const isAgeValid = validateAge();

      if (isNameValid && isEmailValid && isAgeValid) {
        sessionStorage.setItem("name", document.getElementById("name").value);
        sessionStorage.setItem("email", document.getElementById("email").value);
        sessionStorage.setItem("age", document.getElementById("age").value);

        document.getElementById("resultMsg").innerHTML =
          "<p class='success'>Registration Successful! Data stored in sessionStorage.</p>";
      } else {
        document.getElementById("resultMsg").innerHTML =
          "<p class='error'>Please fix validation errors.</p>";
      }
    }
  </script>

</body>
</html>
