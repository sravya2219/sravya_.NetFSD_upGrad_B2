<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8 col-md-10">
      
      <div class="card shadow-sm">
        <div class="card-body p-4">
          
          <h3 class="text-center mb-4">Contact Us</h3>

          <form class="needs-validation" novalidate>

            <div class="row g-3">

              <!-- Full Name -->
              <div class="col-md-6">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" placeholder="Enter your name" required>
                <div class="invalid-feedback">
                  Full Name is required.
                </div>
              </div>

              <!-- Email -->
              <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="Enter your email" required>
                <div class="invalid-feedback">
                  Valid email is required.
                </div>
              </div>

              <!-- Phone -->
              <div class="col-md-6">
                <label class="form-label">Phone</label>
                <input type="tel" class="form-control" placeholder="Enter your phone number" required>
                <div class="invalid-feedback">
                  Phone number is required.
                </div>
              </div>

              <!-- Subject -->
              <div class="col-md-6">
                <label class="form-label">Subject</label>
                <input type="text" class="form-control" placeholder="Enter subject" required>
                <div class="invalid-feedback">
                  Subject is required.
                </div>
              </div>

              <!-- Message -->
              <div class="col-12">
                <label class="form-label">Message</label>
                <textarea class="form-control" rows="4" placeholder="Write your message..." required></textarea>
                <div class="invalid-feedback">
                  Message cannot be empty.
                </div>
              </div>

              <!-- Buttons -->
              <div class="col-12 text-center mt-3">
                <button class="btn btn-primary px-4" type="submit">Submit</button>
                <button class="btn btn-secondary px-4 ms-2" type="reset">Reset</button>
              </div>

            </div>
          </form>

        </div>
      </div>

    </div>
  </div>
</div>

<!-- Bootstrap Validation Script -->
<script>
(() => {
  'use strict'
  const forms = document.querySelectorAll('.needs-validation')
  Array.from(forms).forEach(form => {
    form.addEventListener('submit', event => {
      if (!form.checkValidity()) {
        event.preventDefault()
        event.stopPropagation()
      }
      form.classList.add('was-validated')
    }, false)
  })
})()
</script>

</body>
</html>
