<!DOCTYPE html>
<html>
<head>
    <title>jQuery To-Do App</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        #taskInput {
            padding: 8px;
            width: 250px;
        }

        #addBtn {
            padding: 8px 12px;
            cursor: pointer;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            margin: 8px 0;
            padding: 8px;
            background: #f2f2f2;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .deleteBtn {
            background: red;
            color: white;
            border: none;
            padding: 5px 8px;
            cursor: pointer;
        }

        .counts {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h2>To-Do List</h2>

<input type="text" id="taskInput" placeholder="Enter task">
<button id="addBtn">Add</button>

<ul id="taskList"></ul>

<div class="counts">
    Total Tasks: <span id="totalCount">0</span> |
    Completed Tasks: <span id="completedCount">0</span>
</div>

<script>
$(document).ready(function(){

    function updateCounts() {
        var total = $("#taskList li").length;
        var completed = $("#taskList li.completed").length;

        $("#totalCount").text(total);
        $("#completedCount").text(completed);
    }

    // Add Task
    $("#addBtn").on("click", function(){

        var taskText = $("#taskInput").val().trim();

        if(taskText !== ""){

            var newTask = `
                <li>
                    <span class="taskText">${taskText}</span>
                    <button class="deleteBtn">Delete</button>
                </li>
            `;

            $("#taskList").append(newTask);
            $("#taskInput").val("");
            updateCounts();
        }
    });

    // Mark Complete (Event Delegation)
    $("#taskList").on("click", ".taskText", function(){
        $(this).parent().toggleClass("completed");
        updateCounts();
    });

    // Delete Task (Event Delegation)
    $("#taskList").on("click", ".deleteBtn", function(){
        $(this).parent().remove();
        updateCounts();
    });

});
</script>

</body>
</html>
